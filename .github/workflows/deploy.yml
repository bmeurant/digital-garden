name: Deploy Quartz site to GitHub Pages
 
on:
  push:
    branches:
      - v4
  repository_dispatch:
    types: [build-from-docs]
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Quartz repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info
      - name: Checkout technical-docs repository
        uses: actions/checkout@v4
        with:
          repository: bmeurant/technical-docs
          path: technical-docs
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy files to content folder
        run: |
          mkdir -p content/technical-docs
          cp -r technical-docs/* content/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
 
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
